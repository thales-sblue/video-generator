[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-generator"
version = "0.1.0"
description = "Local-first audiovisual production engine orchestrated by an AI agent (Claude Code)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Opt-in local text-to-speech used by `narrate` / the kokoro adapter. Not required
# for contracts, planning, inspection or diagnosis; `doctor` reports Kokoro as
# missing until this extra and the model files under .local-tools/kokoro/ are
# present. Floors match the documented `Kokoro(model, voices).create(...)` API and
# `soundfile.write`; revisit against a verified local install.
tts = ["kokoro-onnx>=0.4.0", "soundfile>=0.12.0"]
# Opt-in local forced alignment used by `align-captions` / the aligner adapter.
# Captions fall back to the text-tempo estimate without it. Needs a CTranslate2
# Whisper conversion under .local-tools/whisper/ (or WHISPER_HOME); the model is
# loaded with downloads disabled, so nothing is fetched at render time.
align = ["faster-whisper>=1.1.0"]

[project.scripts]
video-generator = "video_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
