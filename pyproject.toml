[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-generator"
version = "0.1.0"
description = "Local-first audiovisual production engine orchestrated by an AI agent (Claude Code)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Opt-in local text-to-speech. Not required for contracts, planning, inspection
# or diagnosis; `doctor` reports Kokoro as missing until this extra and the model
# files under .local-tools/kokoro/ are present. Versions are pinned when the
# narration adapter that uses them lands.
tts = ["kokoro-onnx", "soundfile"]

[project.scripts]
video-generator = "video_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
