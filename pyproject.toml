[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-generator"
version = "0.1.0"
description = "Local-only audiovisual production engine orchestrated by Codex"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
video-generator = "video_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
